<style>
:root{
  color-scheme: light;
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#F7F8F5; --ink:#1C2230; --muted:#626A7C; --rule:#DADDD5;
  --target:#B97A0C; --actual:#2E4A8B;
  --good:#17804F; --good-bg:#DCF1E4; --bad:#C23A2C; --bad-bg:#F9E0DC; --neutral-bg:#ECEDEA; --future:#F7F8F5;
  --focus:#2E4A8B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14171D; --surface:#1C2028; --surface-2:#191C23; --ink:#E8EAEE; --muted:#9AA1AE; --rule:#2E333D;
    --target:#E0A93B; --actual:#8FA8E8;
    --good:#55C893; --good-bg:#173A2A; --bad:#F07A6B; --bad-bg:#45211D; --neutral-bg:#262A33; --future:#191C23;
    --focus:#8FA8E8;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14171D; --surface:#1C2028; --surface-2:#191C23; --ink:#E8EAEE; --muted:#9AA1AE; --rule:#2E333D;
  --target:#E0A93B; --actual:#8FA8E8;
  --good:#55C893; --good-bg:#173A2A; --bad:#F07A6B; --bad-bg:#45211D; --neutral-bg:#262A33; --future:#191C23;
  --focus:#8FA8E8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.wrap{max-width:1440px; margin:0 auto; padding:24px clamp(14px,3vw,36px) 64px}

header.top{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; justify-content:space-between; margin-bottom:20px}
.brand h1{font-size:22px; font-weight:800; margin:0; letter-spacing:-.01em}
.brand p{margin:2px 0 0; color:var(--muted); font-size:13px}
.controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
select,input[type=search],button{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--rule);
  border-radius:8px; padding:7px 10px;
}
button{cursor:pointer}
a.btn{color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:7px 12px; text-decoration:none; font-weight:600}
a.btn:hover{border-color:var(--ink)}
button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

nav.tabs{display:flex; gap:4px; border-bottom:1px solid var(--rule); margin-bottom:24px; overflow-x:auto}
nav.tabs button{border:none; background:none; border-radius:0; padding:10px 14px; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}

/* ---------- target tab ---------- */
.verdict{margin:0 0 6px; font-size:clamp(28px,4.4vw,48px); font-weight:800; letter-spacing:-.02em; line-height:1.1}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.verdict-sub{color:var(--muted); margin:0 0 22px; max-width:78ch; font-size:16px}
.verdict-sub b{color:var(--ink); font-weight:600}

.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin-bottom:28px}
.fact{padding:14px 16px 14px 0}
.fact + .fact{padding-left:16px; border-left:1px solid var(--rule)}
.fact dt{color:var(--muted); font-size:13px}
.fact dd{margin:2px 0 0; font-size:20px; font-weight:700}

.strip-wrap{margin-bottom:30px}
.strip-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:8px}
h2{font-size:17px; margin:0; font-weight:700}
.legend{display:flex; gap:14px; color:var(--muted); font-size:13px; flex-wrap:wrap}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(38px,1fr); gap:3px; overflow-x:auto; padding-bottom:4px}
.cell{border-radius:4px; padding:6px 3px 5px; text-align:center; font-size:12px; min-height:58px; background:var(--future); border:1px solid var(--rule)}
.cell .d{font-weight:700; font-size:13px}
.cell .w{color:var(--muted); font-size:11px}
.cell .v{font-size:10.5px; font-weight:600; margin-top:2px}
.cell.good{background:var(--good-bg); border-color:transparent} .cell.good .v{color:var(--good)}
.cell.bad{background:var(--bad-bg); border-color:transparent} .cell.bad .v{color:var(--bad)}
.cell.event{box-shadow:inset 0 3px 0 var(--target)}
.cell.sj .v{color:var(--ink)}
.matrix td.sj{text-align:center; min-width:46px}
.matrix td.sj.zero{color:var(--muted)}
.moved{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:16px; margin-bottom:28px}
.moved-head{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; justify-content:space-between; margin-bottom:12px}
.moved-head p{margin:0; font-size:16px}
.moved-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:20px}
.moved h3{font-size:14px; margin:0 0 6px}
.moved ol{list-style:none; margin:0; padding:0}
.moved li{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:7px 0; border-top:1px solid var(--rule); font-size:13px}
.moved li .pts{font-weight:700; text-align:right}
.moved li .why{grid-column:1 / -1; color:var(--muted); font-size:12px}
.moved .none{color:var(--muted); font-size:13px; padding:7px 0}
.sj-key{display:inline-flex; align-items:center; gap:6px}
.sj-key b{display:inline-block; width:90px; height:10px; border-radius:2px; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--actual) 60%, transparent)); border:1px solid var(--rule)}

.charts{display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:20px; margin-bottom:30px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:16px}
.panel h2{margin-bottom:10px}
svg text{fill:var(--muted); font-family:inherit; font-size:11px}
svg .grid{stroke:var(--rule); stroke-width:1}

.table-scroll{overflow-x:auto; background:var(--surface); border:1px solid var(--rule); border-radius:10px}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{padding:7px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--rule)}
th{font-weight:600; color:var(--muted); background:var(--surface); position:sticky; top:0; z-index:2}
td.l,th.l{text-align:left}
tr.future td{color:var(--muted)}
td.pos{color:var(--good); font-weight:600} td.neg{color:var(--bad); font-weight:600}
td.hit{background:var(--good-bg)} td.miss{background:var(--bad-bg)}
tr.today td{font-weight:600}
.tag{display:inline-block; padding:1px 7px; border-radius:20px; background:var(--neutral-bg); font-size:12px}

/* ---------- sku tab ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.toolbar input[type=search]{min-width:240px; flex:1 1 240px; max-width:380px}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden}
.seg button{border:none; border-radius:0; padding:7px 12px}
.count{color:var(--muted); font-size:13px; margin-left:auto}
.matrix-scroll{max-height:72vh; overflow:auto; background:var(--surface); border:1px solid var(--rule); border-radius:10px}
.matrix{font-size:12px}
.matrix th,.matrix td{padding:5px 7px}
.matrix th.day{min-width:44px; text-align:center}
.matrix td.u{text-align:center; min-width:44px}
.matrix td.u.hit{background:var(--good-bg); color:var(--good); font-weight:600}
.matrix td.u.miss{background:var(--bad-bg); color:var(--bad); font-weight:600}
.matrix td.u.none{color:var(--muted)}
.matrix .stick{position:sticky; left:0; z-index:1; background:var(--surface)}
.matrix th.stick{z-index:3}
.matrix .stick2{position:sticky; left:150px; z-index:1; background:var(--surface); max-width:260px; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--rule)}
.matrix th.stick2{z-index:3}
.matrix .sku{min-width:150px; max-width:150px; overflow:hidden; text-overflow:ellipsis}
.matrix tr.total td{font-weight:700; background:var(--surface-2); position:sticky; top:31px; z-index:2}
.matrix tr.total td.stick,.matrix tr.total td.stick2{z-index:3}
.matrix th.sortable{cursor:pointer}
.matrix th.sorted::after{content:" ▾"}
.matrix th.sorted.asc::after{content:" ▴"}
.sub{color:var(--muted); font-size:11px; display:block}
.empty{padding:40px; text-align:center; color:var(--muted)}
.note{color:var(--muted); font-size:13px; margin:10px 0 0}
footer{margin-top:36px; color:var(--muted); font-size:12px}
@media (max-width:640px){
  .fact + .fact{border-left:none; padding-left:0}
  .matrix .stick2{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  } else {
    cls = delta>=0?'good':'bad';
    verdict = `${short(Math.abs(delta))} ${delta>=0?'ahead of':'behind'} plan`;
    sub = `After ${done.length} day${done.length>1?'s':''}: <b>${short(mtdA)}</b> sold against a cumulative target of <b>${short(mtdT)}</b> (${(mtdA/mtdT*100).toFixed(1)}%). `+
          (remainingDays>0 ? `To reach ${short(m.monthlyTarget)}, the remaining ${remainingDays} days need <b>${short(reqDrr)}/day</b> vs the current <b>${short(curDrr)}/day</b>.` : `Month closed at ${(mtdA/m.monthlyTarget*100).toFixed(1)}% of target.`);
  }

  const facts = [
    ['Monthly target', hasT? short(m.monthlyTarget):'–'],
    ['MTD actual', short(mtdA)],
    ['MTD target', short(mtdT)],
    ['Achievement', hasT? (mtdA/m.monthlyTarget*100).toFixed(1)+'% of month':'–'],
    ['Days on or above target', hasT && done.length? `${hitDays} of ${done.length}`:'–'],
    ['Run-rate projection', projected!=null? short(projected):'–'],
  ];

  const strip = rows.map(r=>{
    const st = r.dayDelta==null ? '' : (r.dayDelta>=0?'good':'bad');
    const ev = r.event && !/^BAU/i.test(r.event) ? ' event':'';
    const v = r.dayDelta==null ? (r.target!=null? compact(r.target,false):'') : compact(r.dayDelta);
    const tip = `${dFull(r.date)} ${r.event||''}\nTarget ${inr(r.target)}\nActual ${inr(r.actual)}`;
    return `<div class="cell ${st}${ev}" title="${esc(tip)}"><div class="w">${esc((r.day||'').slice(0,2))}</div><div class="d">${dLabel(r.date)}</div><div class="v">${v}</div></div>`;
  }).join('');

  const today = last? last.date : null;
  const table = rows.map(r=>{
    const fut = r.actual==null;
    const dayCls = r.dayDelta==null?'':(r.dayDelta>=0?'hit':'miss');
    const dCls = r.delta==null?'':(r.delta>=0?'pos':'neg');
    const ddCls = r.dayDelta==null?'':(r.dayDelta>=0?'pos':'neg');
    return `<tr class="${fut?'future':''}${r.date===today?' today':''}">
      <td class="l">${dFull(r.date)}</td><td class="l">${esc(r.day)}</td>
      <td class="l">${r.event?`<span class="tag">${esc(r.event)}</span>`:''}</td><td class="l">${esc(r.offer)}</td>
      <td>${r.phasing!=null?(r.phasing*100).toFixed(2)+'%':'–'}</td>
      <td>${inr(r.target)}</td><td class="${dayCls}">${inr(r.actual)}</td><td class="${ddCls}">${signedInr(r.dayDelta)}</td>
      <td>${inr(r.cumTarget)}</td><td>${inr(r.cumActual)}</td><td class="${dCls}">${signedInr(r.delta)}</td>
      <td>${r.units!=null?nf0.format(r.units):'–'}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <p class="verdict ${cls}">${verdict}</p>
    <p class="verdict-sub">${sub}</p>
    <dl class="facts">${facts.map(f=>`<div class="fact"><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>
    <div class="strip-wrap">
      <div class="strip-head"><h2>Day by day</h2>
        <div class="legend"><span><i style="background:var(--good-bg);border:1px solid var(--good)"></i>Beat the day's target</span>
        <span><i style="background:var(--bad-bg);border:1px solid var(--bad)"></i>Below the day's target</span>
        <span><i style="background:var(--target)"></i>Sale event</span></div></div>
      <div class="strip">${strip}</div>
    </div>
    <div class="charts">
      <div class="panel"><h2>Cumulative: target vs actual</h2>${cumChart(rows)}</div>
      <div class="panel"><h2>Daily: actual vs DOD target</h2>${dayChart(rows)}</div>
    </div>
    <h2 style="margin-bottom:10px">Phasing and delta</h2>
    <div class="table-scroll"><table>
      <thead><tr><th class="l">Date</th><th class="l">Day</th><th class="l">Event</th><th class="l">Type</th><th>Phasing</th>
      <th>DOD target</th><th>Actual</th><th>Day delta</th><th>Cum. target</th><th>Cum. actual</th><th>Delta</th><th>Units</th></tr></thead>
      <tbody>${table}</tbody></table></div>
    <p class="note">Delta = cumulative actual − cumulative target. Positive means ahead of plan. DOD target = monthly target × that day's traffic phasing.</p>`;
}

function axisMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/p*2)/2*p; }

function cumChart(rows){
  const W=560,H=240,L=58,R=12,T=12,B=26, n=rows.length;
  const max=axisMax(Math.max(...rows.map(r=>Math.max(r.cumTarget||0,r.cumActual||0))));
  const x=i=>L+(W-L-R)*(n===1?0:i/(n-1)), y=v=>T+(H-T-B)*(1-v/max);
  const path=(k)=>{ let d=''; rows.forEach((r,i)=>{ if(r[k]!=null) d+=(d?'L':'M')+x(i).toFixed(1)+','+y(r[k]).toFixed(1); }); return d; };
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${axisFmt(v,max)}</text>`; }
  let xl=''; rows.forEach((r,i)=>{ if(i%5===0||i===n-1) xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dLabel(r.date)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative target and actual">${g}${xl}
    <path d="${path('cumTarget')}" fill="none" stroke="var(--target)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path('cumActual')}" fill="none" stroke="var(--actual)" stroke-width="2.5"/>
    </svg><div class="legend"><span><i style="background:var(--target)"></i>Cumulative target</span><span><i style="background:var(--actual)"></i>Cumulative actual</span></div>`;
}

function dayChart(rows){
  const W=560,H=240,L=58,R=12,T=12,B=26, n=rows.length;
  const max=axisMax(Math.max(...rows.map(r=>Math.max(r.target||0,r.actual||0))));
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/max);
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${axisFmt(v,max)}</text>`; }
  let bars='', ticks='', xl='';
  rows.forEach((r,i)=>{
    const cx=L+bw*i;
    if(r.actual!=null){
      const col = r.target==null ? 'var(--actual)' : (r.actual>=r.target?'var(--good)':'var(--bad)');
      bars+=`<rect x="${cx+bw*.18}" y="${y(r.actual)}" width="${bw*.64}" height="${Math.max(0,y(0)-y(r.actual))}" fill="${col}" opacity=".85" rx="1.5"><title>${dFull(r.date)}: ${inr(r.actual)} vs ${inr(r.target)}</title></rect>`;
    }
    if(r.target!=null) ticks+=`<line x1="${cx+bw*.08}" x2="${cx+bw*.92}" y1="${y(r.target)}" y2="${y(r.target)}" stroke="var(--target)" stroke-width="2.5"/>`;
    if(i%5===0||i===n-1) xl+=`<text x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${dLabel(r.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily actual versus target">${g}${xl}${bars}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--target)"></i>DOD target</span><span><i style="background:var(--good)"></i>Actual, on or above</span><span><i style="background:var(--bad)"></i>Actual, below</span></div>`;
}

/* ---------- SKU daily ---------- */
function skuStats(s, m){
  const done = s.u.filter(v=>v!=null).length;
  const units = s.u.reduce((a,v)=>a+(v||0),0);
  const rev = s.r.reduce((a,v)=>a+(v||0),0);
  const drr = done? units/done : null;
  const vals = s.u.filter(v=>v!=null);
  const hit = s.plan!=null ? vals.filter(v=>v>=s.plan).length : null;
  return {done, units, rev, drr, hit, achv: s.plan? drr/s.plan : null};
}
function cellClass(v, plan){
  if(v==null) return '';
  if(plan==null) return 'none';
  if(plan===0 && v===0) return 'none';
  return v>=plan ? 'hit' : 'miss';
}

function renderSku(){
  const m=state.m, el=document.getElementById('tab-sku');
  if(!m.skus.length){ el.innerHTML='<p class="empty">No SKU plan or sales for this month yet.</p>'; return; }
  const cats=[...new Set(m.skus.map(s=>s.cat))].sort();
  el.innerHTML = `
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search SKU, style ID or name" value="${esc(state.q)}">
      <select id="cat"><option value="">All categories</option>${cats.map(c=>`<option ${c===state.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <span class="seg" role="group" aria-label="Measure">
        <button type="button" data-meas="units" aria-pressed="${state.measure==='units'}">Units</button>
        <button type="button" data-meas="rev" aria-pressed="${state.measure==='rev'}">Revenue</button></span>
      <button type="button" id="miss" aria-pressed="${state.onlyMiss}">Below plan MTD</button>
      ${m.excel?`<a class="btn" href="${m.excel}" download>Download Excel</a>`:''}
      <span class="count" id="count"></span>
    </div>
    <div class="matrix-scroll" id="mx"></div>
    <p class="note">Green: the SKU sold at or above its planned DRR that day. Red: below. ${state.measure==='rev'?'Revenue view compares against planned final amount ÷ days in month. ':'Planned DRR = planned units ÷ days in month. '}${m.planMonth && m.planMonth!==m.month?`Using the ${m.planMonth} SKU plan (no plan file for this month). `:''}Grey: no plan, or zero planned and zero sold. Click any date or column header to sort; click again to reverse.</p>`;
  el.querySelector('#q').oninput=e=>{state.q=e.target.value; drawMatrix();};
  el.querySelector('#cat').onchange=e=>{state.cat=e.target.value; drawMatrix();};
  el.querySelectorAll('[data-meas]').forEach(b=>b.onclick=()=>{state.measure=b.dataset.meas; renderSku();});
  el.querySelector('#miss').onclick=e=>{state.onlyMiss=!state.onlyMiss; e.target.setAttribute('aria-pressed',state.onlyMiss); drawMatrix();};
  drawMatrix();
}

function drawMatrix(){
  const m=state.m, rev=state.measure==='rev';
  const q=state.q.trim().toLowerCase();
  let list=m.skus.map(s=>({s, st:skuStats(s,m)}));
  if(q) list=list.filter(({s})=>(s.sku+' '+(s.styles||[]).join(' ')+' '+s.name).toLowerCase().includes(q));
  if(state.cat) list=list.filter(({s})=>s.cat===state.cat);
  if(state.onlyMiss) list=list.filter(({s,st})=>s.plan!=null && st.drr!=null && st.drr<s.plan);
  const k=state.sort.key, dir=state.sort.dir;
  const keyf={plan:x=>(rev?x.s.planRev:x.s.plan)??-1, month:x=>(rev?x.s.planAmt:x.s.planUnits)??-1, pom:x=>{const p=rev?x.s.planAmt:x.s.planUnits; return p? (rev?x.st.rev:x.st.units)/p : -1;}, sku:x=>x.s.sku, mtd:x=>rev?x.st.rev:x.st.units, drr:x=>x.st.drr??-1, achv:x=>x.st.achv??-1, prev:x=>x.s.prevDrr??-1};
  const dayIdx = k.startsWith('day:') ? +k.slice(4) : null;
  const getKey = dayIdx!=null ? (x=>((rev?x.s.r:x.s.u)[dayIdx]) ?? -1) : (keyf[k] || keyf.plan);
  list.sort((a,b)=>{ const A=getKey(a),B=getKey(b); return (A>B?1:A<B?-1:0)*dir; });

  const days=m.days;
  const fmt = v => v==null?'':(rev? nf0.format(Math.round(v)) : nf0.format(v));
  const planOf = s => rev ? s.planRev : s.plan;
  const monthPlanOf = s => rev ? s.planAmt : s.planUnits;

  // totals row
  const tot = days.map((d,i)=>{ let any=false, t=0; list.forEach(({s})=>{ const v=(rev?s.r:s.u)[i]; if(v!=null){any=true;t+=v;} }); return any?t:null; });
  const totPlan = list.reduce((a,{s})=>a+(planOf(s)||0),0);
  const totMtd = list.reduce((a,{st})=>a+(rev?st.rev:st.units),0);
  const totMonth = list.reduce((a,{s})=>a+(monthPlanOf(s)||0),0);
  const doneDays = tot.filter(v=>v!=null).length;

  const th=(key,label,cls='')=>`<th class="sortable ${cls} ${k===key?'sorted'+(dir>0?' asc':''):''}" data-k="${key}">${label}</th>`;
  const head = `<tr>${th('sku','NH SKU','l stick sku')}<th class="l stick2">Variant</th><th class="l">Category</th>${th('month', rev?'Month plan ₹':'Month plan')}
    ${th('prev','Prev DRR')}${th('plan', rev?'Planned ₹/day':'Planned DRR')}
    ${days.map((d,i)=>`<th class="day sortable ${k==='day:'+i?'sorted'+(dir>0?' asc':''):''}" data-k="day:${i}" title="Sort by ${dFull(d)} sales">${dLabel(d)}<span class="sub">${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2)}</span></th>`).join('')}
    ${th('mtd','MTD')}${th('drr', rev?'MTD ₹/day':'MTD DRR')}${th('achv','DRR vs plan')}${th('pom','% of month plan')}</tr>`;
  const totalRow = `<tr class="total"><td class="l stick sku">All shown</td><td class="l stick2">${list.length} SKUs</td><td></td><td>${nf0.format(Math.round(totMonth))}</td><td></td>
    <td>${rev? nf0.format(Math.round(totPlan)) : nf1.format(totPlan)}</td>
    ${tot.map(v=>`<td class="u ${cellClass(v,totPlan)}">${fmt(v)}</td>`).join('')}
    <td>${fmt(totMtd)}</td><td>${doneDays? nf1.format(totMtd/doneDays):''}</td><td>${totPlan&&doneDays? Math.round(totMtd/doneDays/totPlan*100)+'%':''}</td><td>${totMonth? Math.round(totMtd/totMonth*100)+'%':''}</td></tr>`;

  const body = list.map(({s,st})=>{
    const p=planOf(s), arr=rev?s.r:s.u;
    const mtd=rev?st.rev:st.units, drr=st.done? mtd/st.done : null;
    const ach = p? drr/p : null;
    const mp = monthPlanOf(s), pom = mp? mtd/mp : null;
    return `<tr><td class="l stick sku" title="${esc(s.sku)} · style ${esc((s.styles||[]).join(', ')||'not mapped')}">${esc(s.sku)}</td><td class="l stick2" title="${esc(s.name)}">${esc(s.name)}</td>
      <td class="l">${esc(s.cat)}</td><td>${mp!=null?nf0.format(Math.round(mp)):''}</td>
      <td>${s.prevDrr!=null?nf1.format(s.prevDrr):''}</td><td>${p!=null?(rev?nf0.format(Math.round(p)):nf1.format(p)):''}</td>
      ${arr.map(v=>`<td class="u ${cellClass(v, rev? p : s.plan)}">${fmt(v)}</td>`).join('')}
      <td>${fmt(mtd)}</td><td>${drr!=null?nf1.format(drr):''}</td>
      <td class="${ach==null?'':(ach>=1?'pos':'neg')}">${ach!=null?Math.round(ach*100)+'%':''}</td>
      <td>${pom!=null?Math.round(pom*100)+'%':''}</td></tr>`;
  }).join('');

  const mx=document.getElementById('mx');
  mx.innerHTML = list.length ? `<table class="matrix"><thead>${head}</thead><tbody>${totalRow}${body}</tbody></table>` : '<p class="empty">No SKUs match these filters.</p>';
  document.getElementById('count').textContent = `${list.length} of ${m.skus.length} SKUs`;
  mx.querySelectorAll('th.sortable').forEach(t=>t.onclick=()=>{
    const key=t.dataset.k; state.sort = {key, dir: state.sort.key===key ? -state.sort.dir : (key==='sku'?1:-1)}; drawMatrix();
  });
}

/* ---------- categories ---------- */
function renderCat(){
  const m=state.m, el=document.getElementById('tab-cat');
  if(!m.skus.length){ el.innerHTML='<p class="empty">No SKU plan or sales for this month yet.</p>'; return; }
  const by={};
  m.skus.forEach(s=>{
    const c=by[s.cat] ||= {cat:s.cat, plan:0, planAmt:0, u:m.days.map(()=>null), r:0, n:0};
    c.n++; c.plan+=s.plan||0; c.planAmt+=s.planAmt||0;
    s.u.forEach((v,i)=>{ if(v!=null) c.u[i]=(c.u[i]||0)+v; });
    c.r+=s.r.reduce((a,v)=>a+(v||0),0);
  });
  const nDays = m.days.length;
  const elapsed = m.daily.filter(r=>r.actual!=null).length;
  const pro = v => v ? v/nDays*elapsed : 0;
  const rows=Object.values(by).map(c=>{
    const done=c.u.filter(v=>v!=null).length, units=c.u.reduce((a,v)=>a+(v||0),0);
    return {...c, done, units, drr: done? units/done:null, hit: c.u.filter(v=>v!=null && v>=c.plan).length, proAmt: pro(c.planAmt)};
  });
  const ck=state.catSort.key, cd=state.catSort.dir;
  const catKey = {
    cat:c=>c.cat.toLowerCase(), n:c=>c.n, plan:c=>c.plan, units:c=>c.units, r:c=>c.r, planAmt:c=>c.planAmt,
    proAmt:c=>c.proAmt, delta:c=>c.r-c.proAmt, vspro:c=>c.proAmt? c.r/c.proAmt : -Infinity,
    pom:c=>c.planAmt? c.r/c.planAmt : -Infinity, drr:c=>c.drr??-Infinity,
    vsdrr:c=>c.plan&&c.drr!=null? c.drr/c.plan : -Infinity, hit:c=>c.hit,
  };
  const getCat = ck.startsWith('day:') ? (c=>c.u[+ck.slice(4)] ?? -Infinity) : (catKey[ck] || catKey.units);
  rows.sort((a,b)=>{ const A=getCat(a),B=getCat(b); return (A>B?1:A<B?-1:0)*cd; });
  const sth=(key,label,cls='',title='')=>`<th class="sortable ${cls} ${ck===key?'sorted'+(cd>0?' asc':''):''}" data-ck="${key}"${title?` title="${title}"`:''}>${label}</th>`;
  const T = rows.reduce((t,c)=>({units:t.units+c.units, r:t.r+c.r, planAmt:t.planAmt+c.planAmt, proAmt:t.proAmt+c.proAmt, plan:t.plan+c.plan, n:t.n+c.n}),
                        {units:0,r:0,planAmt:0,proAmt:0,plan:0,n:0});
  const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '';
  const cls = (a,b) => !b ? '' : (a>=b?'pos':'neg');
  const money = (c) => `
          <td>${nf0.format(c.units)}</td><td>${short(c.r)}</td>
          <td>${c.planAmt?short(c.planAmt):''}</td>
          <td>${c.planAmt&&elapsed?short(c.proAmt):''}</td>
          <td class="${cls(c.r,c.proAmt)}">${c.planAmt&&elapsed?((c.r-c.proAmt)>=0?'+':'−')+short(Math.abs(c.r-c.proAmt)):''}</td>
          <td class="${cls(c.r,c.proAmt)}">${elapsed?pct(c.r,c.proAmt):''}</td>
          <td>${pct(c.r,c.planAmt)}</td>`;
  el.innerHTML = `
    <div class="matrix-scroll"><table class="matrix">
      <thead><tr>${sth('cat','Category','l stick sku')}${sth('n','SKUs')}${sth('plan','Planned DRR')}
        ${m.days.map((d,i)=>sth('day:'+i, dLabel(d), 'day', 'Sort by '+dFull(d))).join('')}
        ${sth('units','MTD units')}${sth('r','MTD revenue')}${sth('planAmt','Month plan ₹')}
        ${sth('proAmt',`Prorated plan ₹<span class="sub">till ${m.dataThrough?dFull(m.dataThrough):'–'}</span>`,'',`Month plan ÷ ${nDays} days × ${elapsed} days`)}
        ${sth('delta','Delta ₹')}${sth('vspro','vs prorated')}${sth('pom','% of month plan')}${sth('drr','MTD DRR')}${sth('vsdrr','DRR vs plan')}${sth('hit','Days hit')}</tr></thead>
      <tbody>
        <tr class="total"><td class="l stick sku">All categories</td><td>${T.n}</td><td>${nf1.format(T.plan)}</td>
          ${m.days.map((d,i)=>{ let any=false,t=0; rows.forEach(c=>{ if(c.u[i]!=null){any=true;t+=c.u[i];} }); return `<td class="u ${any?cellClass(t,T.plan||null):''}">${any?nf0.format(t):''}</td>`; }).join('')}
          ${money(T)}<td>${elapsed?nf1.format(T.units/elapsed):''}</td><td class="${cls(T.units/(elapsed||1),T.plan)}">${T.plan&&elapsed?pct(T.units/elapsed,T.plan):''}</td><td></td></tr>
        ${rows.map(c=>{
        const ach=c.plan&&c.drr!=null? c.drr/c.plan : null;
        return `<tr><td class="l stick sku" title="${esc(c.cat)}">${esc(c.cat)}</td><td>${c.n}</td><td>${nf1.format(c.plan)}</td>
          ${c.u.map(v=>`<td class="u ${cellClass(v, c.plan||null)}">${v==null?'':nf0.format(v)}</td>`).join('')}
          ${money(c)}<td>${c.drr!=null?nf1.format(c.drr):''}</td>
          <td class="${ach==null?'':(ach>=1?'pos':'neg')}">${ach!=null?Math.round(ach*100)+'%':''}</td><td>${c.done? c.hit+' / '+c.done:''}</td></tr>`;
      }).join('')}</tbody></table></div>
    <p class="note">Click any column header to sort; click again to reverse. Prorated plan = month plan ÷ ${nDays} days × ${elapsed} day${elapsed===1?'':'s'} of data (till ${m.dataThrough?dFull(m.dataThrough):'–'}). Delta = MTD revenue − prorated plan; positive means ahead. Category planned DRR is the sum of its SKUs' planned DRR. Revenue is final amount from the sales report.</p>`;
  el.querySelectorAll('th[data-ck]').forEach(t=>t.onclick=()=>{
    const key=t.dataset.ck;
    state.catSort = {key, dir: state.catSort.key===key ? -state.catSort.dir : (key==='cat'?1:-1)};
    renderCat();
  });
}

/* ---------- SJIT share ---------- */
function heat(p){ return p==null ? '' : `background:color-mix(in srgb, var(--actual) ${Math.round(p*60)}%, transparent)`; }
function pctTxt(f,t){ return t ? Math.round(f/t*100)+'%' : ''; }

function renderSjit(){
  const m=state.m, el=document.getElementById('tab-sjit'), S=state.sj, gross=S.basis==='gross';
  const dayTot = r => gross ? r.gross : r.units, dayF = r => gross ? r.grossFbm : r.fbm;
  const rows = m.daily.filter(r=>r.actual!=null && dayF(r)!=null);
  if(!m.skus.length || !rows.length){
    el.innerHTML='<p class="empty">No SJIT data for this month yet. It fills in from the next sales report you run (the report needs the po_type column).</p>';
    return;
  }
  const T = rows.reduce((a,r)=>a+(dayTot(r)||0),0), F = rows.reduce((a,r)=>a+(dayF(r)||0),0);
  const last = rows[rows.length-1];
  const shares = rows.map(r=>dayTot(r)? dayF(r)/dayTot(r) : null).filter(v=>v!=null);
  const best = rows.reduce((b,r)=>{ const v=dayTot(r)?dayF(r)/dayTot(r):-1; return v>b.v?{v,r}:b; },{v:-1,r:null});
  const skuSj = s => ({ t: gross? s.g : s.u, f: gross? s.gf : s.f });
  const skusWithSjit = m.skus.filter(s=>skuSj(s).f.some(v=>v>0)).length;

  const knownDays = rows.map(r=>r.date);
  if(!knownDays.includes(S.day)) S.day = knownDays[knownDays.length-1];
  const selDay = S.day;
  const strip = m.daily.map(r=>{
    const t=dayTot(r), f=dayF(r), known = r.actual!=null && f!=null;
    const p = known && t ? f/t : null;
    const sel = r.date===selDay ? ' outline:2px solid var(--ink); outline-offset:1px;' : '';
    return `<div class="cell sj" data-day="${r.date}" style="${heat(p)};${sel}${known?'cursor:pointer':''}" title="${esc(dFull(r.date))}${known?`\nSJIT ${f} of ${t} orders`:''}"><div class="w">${esc((r.day||'').slice(0,2))}</div><div class="d">${dLabel(r.date)}</div><div class="v">${p!=null?Math.round(p*100)+'%':''}</div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="toolbar">
      <span class="seg" role="group" aria-label="Orders basis">
        <button type="button" data-basis="net" aria-pressed="${!gross}">Net orders</button>
        <button type="button" data-basis="gross" aria-pressed="${gross}">All orders</button></span>
      <span class="count">${gross?'All order lines, including cancelled and returned.':'After removing cancelled, RTO, lost and returned lines (same basis as sales).'}</span>
    </div>
    <p class="verdict">${T? (F/T*100).toFixed(1):'0'}% SJIT this month</p>
    <p class="verdict-sub"><b>${nf0.format(F)}</b> of <b>${nf0.format(T)}</b> orders were fulfilled from Myntra warehouses (po_type FBM); the rest (PPMP) shipped from ours. Latest day, ${dFull(last.date)}: <b>${pctTxt(dayF(last),dayTot(last))}</b>.</p>
    <dl class="facts">
      <div class="fact"><dt>MTD SJIT share</dt><dd>${pctTxt(F,T)}</dd></div>
      <div class="fact"><dt>FBM (SJIT) orders</dt><dd>${nf0.format(F)}</dd></div>
      <div class="fact"><dt>PPMP orders</dt><dd>${nf0.format(T-F)}</dd></div>
      <div class="fact"><dt>Best day</dt><dd>${best.r? pctTxt(dayF(best.r),dayTot(best.r))+' · '+dFull(best.r.date):'–'}</dd></div>
      <div class="fact"><dt>SKUs with any SJIT order</dt><dd>${skusWithSjit} of ${m.skus.length}</dd></div>
    </dl>
    <div class="strip-wrap">
      <div class="strip-head"><h2>SJIT share by day <span class="sub" style="display:inline;font-weight:400">· click a day to see what moved</span></h2><div class="legend"><span class="sj-key">0% <b></b> 100%</span></div></div>
      <div class="strip">${strip}</div>
    </div>
    <div id="sjmoved"></div>
    <div class="panel" style="margin-bottom:28px"><h2>Orders by fulfilment, day by day</h2>${sjitChart(m.daily, dayTot, dayF)}</div>
    <h2 style="margin-bottom:10px">SKU level</h2>
    <div class="toolbar">
      <input type="search" id="sjq" placeholder="Search SKU, style ID or name" value="${esc(S.q)}">
      <select id="sjcat"><option value="">All categories</option>${[...new Set(m.skus.map(s=>s.cat))].sort().map(c=>`<option ${c===S.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <span class="seg" role="group" aria-label="Cell display">
        <button type="button" data-show="pct" aria-pressed="${S.show==='pct'}">Share %</button>
        <button type="button" data-show="cnt" aria-pressed="${S.show==='cnt'}">FBM / total</button></span>
      <span class="count" id="sjcount"></span>
    </div>
    <div class="matrix-scroll" id="sjmx"></div>
    <p class="note">Each cell is that SKU's SJIT share for the day: FBM orders ÷ total orders. Darker = more fulfilled from Myntra warehouses. Blank = no orders that day. Click any header to sort; click again to reverse.</p>`;

  el.querySelectorAll('[data-basis]').forEach(b=>b.onclick=()=>{S.basis=b.dataset.basis; renderSjit();});
  el.querySelectorAll('.cell.sj[data-day]').forEach(c=>c.onclick=()=>{ if(knownDays.includes(c.dataset.day)){ S.day=c.dataset.day; renderSjit(); } });
  drawMoved();
  el.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{S.show=b.dataset.show; renderSjit();});
  el.querySelector('#sjq').oninput=e=>{S.q=e.target.value; drawSjitMatrix();};
  el.querySelector('#sjcat').onchange=e=>{S.cat=e.target.value; drawSjitMatrix();};
  drawSjitMatrix();
}

function drawSjitMatrix(){
  const m=state.m, S=state.sj, gross=S.basis==='gross';
  const q=S.q.trim().toLowerCase();
  let list = m.skus.map(s=>{
    const t = gross? s.g : s.u, f = gross? s.gf : s.f;
    let T=0,F=0; t.forEach((v,i)=>{ if(v!=null && f[i]!=null){ T+=v; F+=f[i]; } });
    return {s, t, f, T, F, p: T? F/T : null};
  }).filter(x=>x.T>0 || x.s.inPlan);
  if(q) list=list.filter(({s})=>(s.sku+' '+(s.styles||[]).join(' ')+' '+s.name).toLowerCase().includes(q));
  if(S.cat) list=list.filter(({s})=>s.cat===S.cat);
  const k=S.sort.key, dir=S.sort.dir;
  const keyf = { sku:x=>x.s.sku, cat:x=>x.s.cat, tot:x=>x.T, fbm:x=>x.F, ppmp:x=>x.T-x.F, share:x=>x.p??-1 };
  const getK = k.startsWith('day:') ? (x=>{ const i=+k.slice(4); return x.t[i]? x.f[i]/x.t[i] : -1; }) : (keyf[k]||keyf.tot);
  list.sort((a,b)=>{ const A=getK(a),B=getK(b); return (A>B?1:A<B?-1:0)*dir; });

  const days=m.days;
  const totT = days.map((d,i)=>{ let any=false,t=0; list.forEach(x=>{ if(x.t[i]!=null && x.f[i]!=null){any=true; t+=x.t[i];} }); return any?t:null; });
  const totF = days.map((d,i)=>{ let t=0; list.forEach(x=>{ if(x.t[i]!=null && x.f[i]!=null) t+=x.f[i]; }); return t; });
  const sumT=list.reduce((a,x)=>a+x.T,0), sumF=list.reduce((a,x)=>a+x.F,0);
  const cell=(f,t)=>{
    if(t==null || f==null) return '<td class="sj"></td>';
    if(!t) return '<td class="sj zero"></td>';
    const p=f/t;
    return `<td class="sj" style="${heat(p)}" title="SJIT ${f} of ${t} orders">${S.show==='pct'? Math.round(p*100)+'%' : f+'/'+t}</td>`;
  };
  const th=(key,label,cls='',title='')=>`<th class="sortable ${cls} ${k===key?'sorted'+(dir>0?' asc':''):''}" data-k="${key}"${title?` title="${title}"`:''}>${label}</th>`;
  const head = `<tr>${th('sku','NH SKU','l stick sku')}<th class="l stick2">Variant</th>${th('cat','Category','l')}
    ${th('tot','MTD orders')}${th('fbm','FBM')}${th('ppmp','PPMP')}${th('share','SJIT share')}
    ${days.map((d,i)=>th('day:'+i, `${dLabel(d)}<span class="sub">${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2)}</span>`, 'day', 'Sort by '+dFull(d)+' SJIT share')).join('')}</tr>`;
  const total = `<tr class="total"><td class="l stick sku">All shown</td><td class="l stick2">${list.length} SKUs</td><td></td>
    <td>${nf0.format(sumT)}</td><td>${nf0.format(sumF)}</td><td>${nf0.format(sumT-sumF)}</td><td>${pctTxt(sumF,sumT)}</td>
    ${days.map((d,i)=>cell(totT[i]==null?null:totF[i], totT[i])).join('')}</tr>`;
  const body = list.map(x=>`<tr><td class="l stick sku" title="${esc(x.s.sku)} · style ${esc((x.s.styles||[]).join(', ')||'not mapped')}">${esc(x.s.sku)}</td>
    <td class="l stick2" title="${esc(x.s.name)}">${esc(x.s.name)}</td><td class="l">${esc(x.s.cat)}</td>
    <td>${nf0.format(x.T)}</td><td>${nf0.format(x.F)}</td><td>${nf0.format(x.T-x.F)}</td>
    <td style="${heat(x.p)}">${x.p!=null?Math.round(x.p*100)+'%':''}</td>
    ${days.map((d,i)=>cell(x.f[i], x.t[i])).join('')}</tr>`).join('');
  const mx=document.getElementById('sjmx');
  mx.innerHTML = list.length? `<table class="matrix"><thead>${head}</thead><tbody>${total}${body}</tbody></table>` : '<p class="empty">No SKUs match these filters.</p>';
  document.getElementById('sjcount').textContent = `${list.length} SKUs`;
  mx.querySelectorAll('th.sortable').forEach(t=>t.onclick=()=>{
    const key=t.dataset.k; S.sort={key, dir: S.sort.key===key ? -S.sort.dir : ((key==='sku'||key==='cat')?1:-1)}; drawSjitMatrix();
  });
}

/* what drove the SJIT share change on the selected day */
function drawMoved(){
  const m=state.m, S=state.sj, gross=S.basis==='gross', box=document.getElementById('sjmoved');
  const di = m.days.indexOf(S.day);
  if(di<0){ box.innerHTML=''; return; }
  const baseIdx = S.base==='prev' ? [di-1] : S.base==='mtd' ? [...Array(di).keys()] : [di-7,di-6,di-5,di-4,di-3,di-2,di-1];
  const T=s=>gross?s.g:s.u, F=s=>gross?s.gf:s.f;
  const valid = i => i>=0 && m.skus.some(s=>F(s)[i]!=null);
  const bIdx = baseIdx.filter(valid);
  const baseLabel = {prev:'the previous day', mtd:'the month so far', '7d':'the previous 7 days'}[S.base];
  const picker = `<select id="sjbase" aria-label="Compare with">
      <option value="7d" ${S.base==='7d'?'selected':''}>vs previous 7 days</option>
      <option value="prev" ${S.base==='prev'?'selected':''}>vs previous day</option>
      <option value="mtd" ${S.base==='mtd'?'selected':''}>vs month so far</option></select>`;
  if(!bIdx.length){
    box.innerHTML=`<div class="moved"><div class="moved-head"><p>No earlier days to compare ${dFull(S.day)} with.</p>${picker}</div></div>`;
    box.querySelector('#sjbase').onchange=e=>{S.base=e.target.value; drawMoved();};
    return;
  }
  // per SKU: today and baseline (pooled) orders
  const rows = m.skus.map(s=>{
    const td=T(s)[di]||0, fd=F(s)[di]||0;
    let tb=0, fb=0; bIdx.forEach(i=>{ tb+=T(s)[i]||0; fb+=F(s)[i]||0; });
    return {s, td, fd, tb, fb};
  });
  const Td=rows.reduce((a,r)=>a+r.td,0), Fd=rows.reduce((a,r)=>a+r.fd,0);
  const Tb=rows.reduce((a,r)=>a+r.tb,0), Fb=rows.reduce((a,r)=>a+r.fb,0);
  if(!Td || !Tb){ box.innerHTML=''; return; }
  const Sd=Fd/Td, Sb=Fb/Tb, dS=Sd-Sb;
  // exact split of the change: sum of contributions = dS
  rows.forEach(r=>{
    r.c = (r.fd - Sb*r.td)/Td - (r.fb - Sb*r.tb)/Tb;
    r.sd = r.td? r.fd/r.td : null; r.sb = r.tb? r.fb/r.tb : null;
    const rate = (r.sd!=null && r.sb!=null) ? (r.td/Td)*(r.sd-r.sb) : 0;
    r.byShare = Math.abs(rate) >= Math.abs(r.c-rate);
  });
  const nb=bIdx.length, avg=v=>v/nb, usual = S.base==='prev' ? 'yesterday' : 'usually';
  const pts=v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(1)+' pts';
  const why=r=>{
    const sh = (r.sd==null?'no orders':Math.round(r.sd*100)+'%') + ' vs ' + (r.sb==null?'no orders':Math.round(r.sb*100)+'%');
    const vol = `${r.td} orders vs ${nf1.format(avg(r.tb))}/day`;
    if(r.tb===0) return `New volume: ${r.fd} of ${r.td} orders via SJIT (none in the baseline)`;
    if(r.td===0) return `No orders today (was ${nf1.format(avg(r.tb))}/day at ${Math.round(r.sb*100)}% SJIT)`;
    const mix = `${(r.td/Td*100).toFixed(1)}% of the day's orders vs ${(r.tb/Tb*100).toFixed(1)}% ${usual}`;
    return r.byShare ? `Share moved: ${sh} SJIT · ${vol}` : `Mix moved: ${mix} · ${sh} SJIT`;
  };
  const li=r=>`<li><span>${esc(r.s.sku)} <span class="sub" style="display:inline">${esc(r.s.name||'')}</span></span><span class="pts ${r.c>=0?'pos':'neg'}" style="color:var(${r.c>=0?'--good':'--bad'})">${pts(r.c)}</span><span class="why">${why(r)}</span></li>`;
  const up = rows.filter(r=>r.c>=0.002).sort((a,b)=>b.c-a.c).slice(0,5);
  const dn = rows.filter(r=>r.c<=-0.002).sort((a,b)=>a.c-b.c).slice(0,5);
  // SKUs whose own share collapsed (enough volume to matter)
  const fell = rows.filter(r=>r.sd!=null && r.sb!=null && r.td>=5 && avg(r.tb)>=3 && r.sb-r.sd>=0.3)
                   .sort((a,b)=>(b.sb-b.sd)-(a.sb-a.sd)).slice(0,5);
  box.innerHTML = `<div class="moved">
    <div class="moved-head">
      <p><b>${dFull(S.day)}: ${Math.round(Sd*100)}% SJIT</b> vs ${Math.round(Sb*100)}% over ${baseLabel} <b style="color:var(${dS>=0?'--good':'--bad'})">(${pts(dS)})</b></p>
      ${picker}
    </div>
    <div class="moved-cols">
      <div><h3>Pushed SJIT share up</h3>${up.length?`<ol>${up.map(li).join('')}</ol>`:'<p class="none">Nothing notable.</p>'}</div>
      <div><h3>Pulled SJIT share down</h3>${dn.length?`<ol>${dn.map(li).join('')}</ol>`:'<p class="none">Nothing notable.</p>'}</div>
      <div><h3>Own SJIT share fell sharply</h3>${fell.length?`<ol>${fell.map(r=>`<li><span>${esc(r.s.sku)} <span class="sub" style="display:inline">${esc(r.s.name||'')}</span></span><span class="pts" style="color:var(--bad)">${Math.round(r.sb*100)}% → ${Math.round(r.sd*100)}%</span><span class="why">${r.fd} of ${r.td} orders via SJIT today; ${usual} ${nf1.format(avg(r.fb))} of ${nf1.format(avg(r.tb))}/day. Check SJIT stock.</span></li>`).join('')}</ol>`:'<p class="none">No SKU with real volume dropped 30+ pts.</p>'}</div>
    </div>
    <p class="note">Points add up to the total change. "Share moved" = the SKU's own SJIT % changed; "Mix moved" = its slice of the day's orders grew or shrank, so a high-SJIT SKU growing lifts the total and a low-SJIT SKU growing drags it.</p>
  </div>`;
  box.querySelector('#sjbase').onchange=e=>{S.base=e.target.value; drawMoved();};
}

function sjitChart(rows, dayTot, dayF){
  const W=1100,H=240,L=46,R=46,T=14,B=26, n=rows.length;
  const max=axisMax(Math.max(1,...rows.map(r=>r.actual!=null? (dayTot(r)||0):0)));
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/max), yp=p=>T+(H-T-B)*(1-p);
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${nf0.format(v)}</text><text x="${W-R+6}" y="${y(v)+4}">${i*25}%</text>`; }
  let bars='', line='', xl='';
  rows.forEach((r,i)=>{
    const cx=L+bw*i, t=dayTot(r), f=dayF(r);
    if(r.actual!=null && f!=null && t){
      bars+=`<rect x="${cx+bw*.15}" y="${y(t)}" width="${bw*.7}" height="${y(0)-y(t)}" fill="var(--rule)" rx="1.5"><title>${dFull(r.date)}: ${t-f} PPMP</title></rect>`;
      bars+=`<rect x="${cx+bw*.15}" y="${y(f)}" width="${bw*.7}" height="${y(0)-y(f)}" fill="var(--actual)" rx="1.5"><title>${dFull(r.date)}: ${f} FBM of ${t} (${Math.round(f/t*100)}%)</title></rect>`;
      line+=(line?'L':'M')+(cx+bw/2).toFixed(1)+','+yp(f/t).toFixed(1);
    }
    if(i%5===0||i===n-1) xl+=`<text x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${dLabel(r.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="FBM and PPMP orders per day with SJIT share">${g}${xl}${bars}
    <path d="${line}" fill="none" stroke="var(--target)" stroke-width="2.5"/></svg>
    <div class="legend"><span><i style="background:var(--actual)"></i>FBM (SJIT) orders</span><span><i style="background:var(--rule)"></i>PPMP orders</span><span><i style="background:var(--target)"></i>SJIT share % (right axis)</span></div>`;
}

/* ---------- unmapped styles ---------- */
function renderUnmapped(){
  const m=state.m, el=document.getElementById('tab-unm'), list=(m.unmapped||[]).slice();
  const badge=document.getElementById('unm-count');
  const nNew = list.filter(r=>r.reason==='not_mapped').length;
  badge.hidden = !nNew; badge.textContent = nNew; badge.style.cssText = nNew ? 'background:var(--bad-bg);color:var(--bad);font-weight:700' : '';
  if(!m.skus.length){ el.innerHTML='<p class="empty">No SKU plan or mapping for this month yet, so nothing to check against.</p>'; return; }
  if(!list.length){ el.innerHTML='<p class="verdict good">Every style ID with orders is mapped</p><p class="verdict-sub">All orders this month flowed into an NH SKU in the plan.</p>'; return; }
  const k=state.um.sort.key, dir=state.um.sort.dir;
  const kf={style:r=>r.style, sellerSku:r=>r.sellerSku, name:r=>r.name, type:r=>r.type, reason:r=>r.reason, first:r=>r.first, last:r=>r.last,
            orders:r=>r.orders, gross:r=>r.gross??-1, revenue:r=>r.revenue, sjit:r=>r.orders? (r.fbm??0)/r.orders : -1};
  const get = k.startsWith('day:') ? (r=>r.u[+k.slice(4)]??-1) : (kf[k]||kf.revenue);
  list.sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  const rev = list.filter(r=>r.reason==='not_mapped').reduce((a,r)=>a+r.revenue,0);
  const ord = list.filter(r=>r.reason==='not_mapped').reduce((a,r)=>a+r.orders,0);
  const nPlan = list.length - nNew;
  const th=(key,label,cls='',title='')=>`<th class="sortable ${cls} ${k===key?'sorted'+(dir>0?' asc':''):''}" data-k="${key}"${title?` title="${title}"`:''}>${label}</th>`;
  const lastDay = m.dataThrough;
  el.innerHTML = `
    <p class="verdict ${nNew?'bad':''}">${nNew} style ID${nNew===1?'':'s'} not in the mapping</p>
    <p class="verdict-sub">${nNew? `They brought in <b>${nf0.format(ord)}</b> net orders (<b>${short(rev)}</b>) this month that aren't counted against any NH SKU, so SKU daily, Categories and SJIT share undercount them. Add each style ID to <b>inputs/sku_mapping/</b> and rerun.`:''}
    ${nPlan? ` ${nPlan} more style ID${nPlan===1?' is':'s are'} mapped, but to an NH SKU that isn't in this month's plan.`:''}</p>
    <div class="toolbar">${m.unmappedCsv?`<a class="btn" href="${m.unmappedCsv}" download>Download as CSV</a>`:''}
      <span class="count">The CSV has an empty NH SKU column: fill it in and paste the rows into your mapping file.</span></div>
    <div class="matrix-scroll"><table class="matrix">
      <thead><tr>${th('style','Style ID','l stick sku')}${th('sellerSku','Seller SKU','l')}${th('name','Style name','l')}${th('type','Article type','l')}${th('reason','Issue','l')}
        ${th('first','First order')}${th('last','Last order')}${th('orders','Net orders')}${th('gross','All orders')}${th('revenue','Revenue')}${th('sjit','SJIT')}
        ${m.days.map((d,i)=>th('day:'+i, dLabel(d), 'day', 'Sort by '+dFull(d)+' orders')).join('')}</tr></thead>
      <tbody>${list.map(r=>`<tr>
        <td class="l stick sku">${r.style}</td><td class="l">${esc(r.sellerSku)}</td>
        <td class="l" style="max-width:320px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.name)}">${esc(r.name)}</td><td class="l">${esc(r.type)}</td>
        <td class="l">${r.reason==='not_mapped'?'<span class="tag" style="background:var(--bad-bg);color:var(--bad)">Not in mapping</span>':`<span class="tag" title="Mapped to ${esc(r.mappedTo)}">NH SKU not in plan · ${esc(r.mappedTo)}</span>`}</td>
        <td>${dFull(r.first)}</td><td class="${r.last===lastDay?'pos':''}">${dFull(r.last)}</td>
        <td>${nf0.format(r.orders)}</td><td>${r.gross!=null?nf0.format(r.gross):''}</td><td>${inr(r.revenue)}</td>
        <td>${r.fbm!=null&&r.orders?Math.round(r.fbm/r.orders*100)+'%':''}</td>
        ${r.u.map(v=>`<td class="u ${v?'':'none'}">${v==null?'':(v||'')}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="note">Includes any style ID with at least one order line this month, even if it was later cancelled or returned. A green last-order date means it's still selling as of ${lastDay?dFull(lastDay):'the latest data'}. Click any header to sort.</p>`;
  el.querySelectorAll('th.sortable').forEach(t=>t.onclick=()=>{
    const key=t.dataset.k; state.um.sort={key, dir: state.um.sort.key===key ? -state.um.sort.dir : (['style','sellerSku','name','type','reason'].includes(key)?1:-1)}; renderUnmapped();
  });
}

init();
</script>
</body>
</html>
